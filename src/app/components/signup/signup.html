<div class="container">
  <h2>Cadastro</h2>

  <form>
    <div>
      <label>Nome</label>
      <input type="text" [(ngModel)]="name" name="name" placeholder="Seu Nome">
    </div>

    <div>
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="@gmail.com">
    </div>

    <div>
      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="●●●●●●">
    </div>

    <div>
      <label>Endereço</label>
      <input type="text" [(ngModel)]="address" name="address" placeholder="Rua ...">
    </div>

    @if(errorMessage){
      <p>{{ errorMessage }}</p>
    }

    <button type="button" (click)="onSignUp()">Cadastrar</button>
  </form>

  <p>Já tem conta?<a routerLink="/login">Entrar</a></p>
</div>
